<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>You're Online</title>
    <script>
        function startClock() {
            $(if popup == 'true')
                open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)
            location.href = unescape('$(link-redirect-esc)');
        }

    </script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            color: #0f172a;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
            min-width: 2.5in;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f0fdf4 0%, #eff6ff 100%);
        }

        .container {
            width: 2.6in;
            padding: .25in .2in;
            text-align: center;
        }

        .badge {
            width: .55in;
            height: .55in;
            margin: 0 auto .12in;
            border-radius: 50%;
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(34, 197, 94, .35);
        }

        .badge svg {
            width: .3in;
            height: .3in;
        }

        h1 {
            margin: 0 0 .06in;
            font-size: 13pt;
            font-weight: 800;
            color: #14532d;
        }

        .subtext {
            margin: 0 0 .16in;
            font-size: 9pt;
            font-weight: 500;
            color: #475569;
            line-height: 1.4;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: #dcfce7;
            overflow: hidden;
            margin-bottom: .14in;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #16a34a;
            border-radius: 999px;
            transform-origin: left;
            animation: fill 2s linear forwards;
        }

        @keyframes fill {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        a.manual-link {
            display: inline-block;
            text-decoration: none;
            font-size: 8.5pt;
            font-weight: 600;
            color: #2563eb;
        }

        a.manual-link:hover {
            text-decoration: underline;
        }
    </style>


</head>

<body onLoad="startClock()">

    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <div class="container">
                    <div class="badge">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h1>You're Connected</h1>
                    <p class="subtext">Payment confirmed. Taking you back to the internet now &mdash; sit tight.</p>
                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                    <a class="manual-link" href="$(link-redirect)">Not redirected? Tap here</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
