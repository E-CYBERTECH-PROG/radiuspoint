<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="refresh" content="2; url=$(link-orig)">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <title>[network_name] — Connecting</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    // RouterOS's advertise-interstitial flow: pop $(link-redirect) once in its own named
    // window, then always continue the original tab to $(link-orig) — the meta-refresh above
    // is the fallback if this popup path is blocked or JS doesn't run at all.
    var popup = '';
    function openOrig() {
      if (window.focus) popup.focus();
      location.href = unescape('$(link-orig-esc)');
    }
    function openAd() {
      location.href = unescape('$(link-redirect-esc)');
    }
    function openAdvert() {
      if (window.name != 'hotspot_advert') {
        popup = open('$(link-redirect)', 'hotspot_advert', '');
        setTimeout("openOrig()", 1000);
        return;
      }
      setTimeout("openAd()", 1000);
    }
  </script>
  <style>
    .connecting-spinner {
      width: 34px; height: 34px; margin: 4px auto 14px;
      border: 3px solid rgba(52, 152, 219, .25);
      border-top-color: #3498db;
      border-radius: 50%;
      animation: rp-spin 0.8s linear infinite;
    }
    @keyframes rp-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body onload="openAdvert()">

  <div class="bgimg">
    <img src="assets/img/global-network.jpg" alt="" />
  </div>

  <div class="wrap">
    <div class="main-container payment-options">
      <div class="container networkname-banner">
        <div class="connecting-spinner" aria-hidden="true"></div>
        <h1 class="ssid">You're connected!</h1>
        <p class="banner-instruction">Taking you to the internet now&hellip;</p>
      </div>
    </div>
  </div>

</body>

</html>
